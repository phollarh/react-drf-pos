services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./bukkofpos/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./bukkofpos
    restart: unless-stopped
    command: >
      uvicorn bukkofpos.asgi:application
      --host 0.0.0.0
      --port 8000
    env_file:
      - ./bukkofpos/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/assets
    networks:
      - pos-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: ./bukkofpos
    restart: unless-stopped
    command: python -m celery -A bukkofpos worker --loglevel=info
    env_file:
      - ./bukkofpos/.env
    volumes:
      - media_data:/app/media
    networks:
      - pos-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./bukkofpos
    restart: unless-stopped
    command: >
      python -m celery -A bukkofpos beat
      --loglevel=info
      --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - ./bukkofpos/.env
    volumes:
      - celerybeat_data:/var/lib/celery
    networks:
      - pos-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./posfrontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - static_data:/app/assets:ro
      - media_data:/app/media:ro
    networks:
      - pos-network
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
  static_data:
  celerybeat_data:

networks:
  pos-network:
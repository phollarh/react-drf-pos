services:

  db:
    image : postgres:17
    container_name : pos-db
    restart: unless-stopped
    env_file:
      - ./bukkofpos/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: pos-redis
    restart: unless-stopped
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5



  backend:
    container_name : pos-backend
    volumes:
      - ./bukkofpos:/app
      - type: bind
        source: ./secrets/qz/private-key.pem
        target: /run/secrets/qz-private-key.pem
        read_only: true
        bind:
          create_host_path: false
    build:
      context: ./bukkofpos
      dockerfile: DockerfileDev
      
    ports:
      - "8000:8000"
    env_file:
      - ./bukkofpos/.env
    networks : 
      - pos-network
    depends_on:
      - db
      
  celery:
    container_name: pos-celery
    build: 
      context: ./bukkofpos
      dockerfile: DockerfileDev
    command: celery -A bukkofpos worker --loglevel=info
    volumes:
      - ./bukkofpos:/app
    env_file:
      - ./bukkofpos/.env
    depends_on:
      - db
      - redis
    networks:
      - pos-network

  celery-beat:
    container_name: pos-celery-beat
    build:
      context: ./bukkofpos
      dockerfile: DockerfileDev
    command: >
      python -m celery
      -A bukkofpos
      beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./bukkofpos:/app
    env_file:
      - ./bukkofpos/.env
    networks:
      - pos-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    networks:
      - pos-network
    container_name : pos-frontend
    volumes:
      - ./posfrontend:/app
      - /app/node_modules
    build:
      context: ./posfrontend
      dockerfile: DockerfileDev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    
volumes:
  postgres_data:
# logging:
